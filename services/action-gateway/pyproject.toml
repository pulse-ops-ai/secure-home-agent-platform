[project]
name = "secure-home-action-gateway"
version = "0.0.0"
description = "Action mediation; the sole holder of Home Assistant credentials."
readme = "README.md"
requires-python = ">=3.13"
# No runtime dependencies. See AGENTS.md — adding one is a reviewed decision.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secure_home_action_gateway"]
