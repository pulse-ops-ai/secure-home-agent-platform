[project]
name = "secure-home-policy-engine"
version = "0.0.0"
description = "Deterministic operational and safety policy. No model in this path."
readme = "README.md"
requires-python = ">=3.13"
# No runtime dependencies. See AGENTS.md — adding one is a reviewed decision.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secure_home_policy_engine"]
