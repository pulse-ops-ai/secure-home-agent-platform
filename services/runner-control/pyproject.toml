[project]
name = "secure-home-runner-control"
version = "0.0.0"
description = "Provider-neutral runner substrate: profiles, sandboxes, run lifecycle, evidence."
readme = "README.md"
requires-python = ">=3.13"
# No runtime dependencies. See AGENTS.md — adding one is a reviewed decision.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secure_home_runner_control"]
