[project]
name = "secure-home-automation-service"
version = "0.0.0"
description = "Persisted automations: trigger, scope, expiration, profile-version binding."
readme = "README.md"
requires-python = ">=3.13"
# No runtime dependencies. See AGENTS.md — adding one is a reviewed decision.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secure_home_automation_service"]
