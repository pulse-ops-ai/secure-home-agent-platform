# Repository merge gate.
#
# Implements the ADR-0012 §20 execution model:
#
#     always-on repository governance gates
#   + path-aware service / package / application gates
#   + root configuration changes fan out to all affected gates
#
# The governance jobs below are marked `# GOVERNANCE-UNCONDITIONAL` and carry no
# `if:` condition. That is load-bearing, not decorative: a bug in the
# affected-target classifier can never skip them. tests/test_affected_targets.py
# asserts both the marker and the absence of a condition.
#
# Target jobs are selected by scripts/affected-targets.mjs, which resolves the
# workspace DEPENDENCY GRAPH rather than matching directories — a change to a
# shared package runs every dependent. A skipped target still reports a
# conclusion, so a required check can never be satisfied by never running.
#
# CI is part of the governance boundary, so every third-party action is pinned
# to a full commit SHA. A tag like `@v7` is a moving reference. Dependabot
# proposes SHA bumps as reviewable pull requests (.github/dependabot.yml).
#
# Toolchain versions match the Raspberry Pi. The CPU architecture differs
# (x86_64 here, ARM64 on the Pi) — this is not a claim of an identical
# environment, only of identical tool versions.
#
# Nothing here deploys, starts a service, or touches a credential.

name: checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Superseding a stale run is correct for a PULL REQUEST ref: the head moved,
# and the newest run checks everything the old one would have. It is WRONG for
# push and dispatch runs: each push-to-main run checks its own before->head
# window (RELEASE_HISTORY_BASE below), so a run cancelled by the next merge
# would leave its window examined by NO later run — quietly breaking the "the
# baseline was itself governed" induction the release-history gate stands on.
# Non-PR runs therefore each get a group of their own and always run to
# completion.
concurrency:
  group: checks-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24.18.1'
  UV_VERSION: '0.12.1'

jobs:
  # ==========================================================================
  # GOVERNANCE-UNCONDITIONAL
  # Repository-wide gates. Never path-filtered, never gated on the classifier.
  # ==========================================================================
  governance:
    name: repository governance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Release history is a two-revision property: a deleted record, a
          # re-identified version, and an illegal state jump are all invisible in
          # a single revision. The comparison needs the prior one.
          fetch-depth: 0

      # Needs no toolchain — the same property that lets it run on a
      # freshly-prepared Pi before uv or Node exist.
      - name: Scaffold structure, indexes, and taxonomy
        run: bash scripts/validate-scaffold.sh

      - name: Tracked secrets and tracked binaries
        run: bash scripts/scan-secrets.sh

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      # Structural only: that the knowledge registry is coherent and that no
      # specification directory has grown authored content. Node standard
      # library, so it needs no install — but it does need node, which is why it
      # follows the setup step rather than sitting with the shell checks above.
      # NOT content admission — that is a separate step below, which hands real
      # bytes to the package that owns the content rules.
      - name: Knowledge registry
        run: node scripts/check-knowledge.mjs

      # The image lock and lineage invariants (deploy/images/image-lock.yaml):
      # closed lineage classes, immutable external pins, the base->derived
      # digest chain, provider-neutrality of the base and gates definitions,
      # and inertness (no profile references an image, no launcher token, no
      # runtime configuration). Structural only — REAL digests are produced
      # and re-verified by the images workflow, never asserted here.
      - name: Image lineage
        run: node scripts/check-images.mjs

      # --frozen-lockfile fails on a stale or drifted lockfile rather than
      # rewriting it. CI never mutates a manifest or the lockfile.
      - name: Manifest and lockfile consistency
        run: pnpm install --frozen-lockfile

      - name: Dependency manifest policy (Syncpack)
        run: pnpm run deps:check

      # Check-only. CI never rewrites a file — a job that reformats reports on
      # something the repository does not contain.
      - name: Formatting (Prettier)
        run: pnpm run format:check

      - name: Workspace taxonomy and manifest dependency direction
        run: pnpm run check:workspace

      # A separate gate from the one above, deliberately. `check:workspace`
      # governs what a manifest may DECLARE and excludes devDependencies from
      # layering; that leaves production source free to import a devDependency
      # and cross a layer. This reads the source instead. Removing either one
      # re-opens a direction hole that the other cannot see.
      - name: Source import direction
        run: pnpm run check:imports

      # REAL repository content through admission. `check-knowledge.mjs` above
      # is the registry/scaffold checker and cannot see content rules; this runs
      # the package that owns them over whatever knowledge/ actually contains.
      #
      # It sits in the GOVERNANCE-UNCONDITIONAL job deliberately. Behind the
      # affected-target classifier, a change touching only knowledge/** could
      # select no TypeScript target and skip admission entirely — the one change
      # shape that most needs it.
      #
      # Only the toolchain is built: enough to invoke the canonical package,
      # without making the whole workspace a prerequisite for governance.
      - name: Build the knowledge toolchain
        run: pnpm --filter @secure-home/knowledge-toolchain run build

      - name: Knowledge content admission
        run: pnpm run check:knowledge-content

      - name: Set releases
        run: pnpm run check:set-releases

      - name: OpenSpec schema (real parser)
        # This repository AUTHORS an OpenSpec schema, so the parser that will
        # read it must accept it. validate-scaffold.sh is fast structural
        # defence in depth and cannot make this claim.
        run: pnpm run check:openspec-schema

      - name: OpenSpec review history
        # Append-only history is a two-revision repository property, so it runs
        # here always. The PRE-APPLY review gate is deliberately NOT a CI step:
        # it refuses repository change after the reviewed planning commit, which
        # every implementation commit legitimately is. CI tests that mechanism
        # in the governance suite instead of re-running the authorization.
        env:
          EVENT_BASE: >-
            ${{ github.event_name == 'pull_request'
                && github.event.pull_request.base.sha
                || github.event.before }}
        run: |
          set -euo pipefail
          base="$EVENT_BASE"
          case "$base" in *[!0]*) ;; *) base="" ;; esac
          REVIEW_HISTORY_BASE="$base" pnpm run check:review-history

      - name: Lint policy integrity
        # The engine-neutral policy manifest, its per-engine mappings, and the
        # repository-wide member-role projection. Unconditional: a role
        # reassignment changes which policies block for a member, and the
        # representative probes in the package's own suite cannot see that.
        run: pnpm run check:lint-policy

      - name: Release history
        # CI knows the exact baseline; the script's local inference is for
        # developers, not for the gate. A SUPPLIED base is exclusive: if it does
        # not resolve the run FAILS rather than quietly comparing against some
        # other revision.
        env:
          EVENT_BASE: >-
            ${{ github.event_name == 'pull_request'
                && github.event.pull_request.base.sha
                || github.event.before }}
        run: |
          set -euo pipefail
          base="$EVENT_BASE"
          # All-zeros is git's "no such commit" sentinel — first push,
          # force-push, or manual dispatch. That means "no baseline to give",
          # not "compare against nothing", so the script infers one instead and
          # still fails if it cannot find a usable revision. Passing the
          # sentinel through would fail every force-push for no reason.
          case "$base" in *[!0]*) ;; *) base="" ;; esac
          RELEASE_HISTORY_BASE="$base" pnpm run check:release-history

  # ==========================================================================
  # GOVERNANCE-UNCONDITIONAL
  # The classifier decides which target gates run, so it is itself governance.
  # Path-filtering its tests would let a change to target selection skip the
  # validation of target selection.
  # ==========================================================================
  classifier:
    name: affected-target calculation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The governance suite runs here, and it now includes release-history
          # tests that assert the LIVE repository passes its own two-revision
          # gate. That control cannot run against a shallow clone, and the gate
          # fails rather than skipping when no baseline resolves — correctly.
          # So the requirement is declared here instead of weakened there.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      # The governance tests invoke the real checks as subprocesses, and
      # `check-source-imports.mjs` parses with TypeScript. Testing the gate
      # therefore needs the same toolchain the gate needs. Stubbing it out, or
      # skipping those tests when the module is absent, would mean the gate that
      # runs unconditionally is verified conditionally.
      - name: Enable Corepack
        run: corepack enable

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # The governance suite invokes `scripts/check-knowledge-content.mjs`,
      # which imports the published package export — so `dist/` must exist here
      # too, not only in the job that runs the gate itself. Without this the
      # integration tests fail on a missing module, which looks like a broken
      # test rather than an unbuilt dependency.
      - name: Build the knowledge toolchain
        run: pnpm --filter @secure-home/knowledge-toolchain run build

      # The framework-conformance suite drives the adapters' BUILT process
      # entries as subprocesses, and fails — deliberately, not skips — when
      # dist/ is absent, for the same reason as above: a gate verified
      # conditionally is not verified. The `...` filter suffix builds the
      # adapters' workspace dependencies (contracts) first — a targeted
      # `run build` does not, and the adapters' own build scripts are bare
      # `tsc` by repository convention.
      - name: Build the platform adapters
        run: pnpm --filter @secure-home/adapter-claude-code... --filter @secure-home/adapter-copilot-cli... run build

      # The WHOLE suite, not a hand-listed subset. These tests guard the
      # unconditional gates — target selection, the workspace layer map, the
      # secret scanner, source import direction — so running a curated list
      # means a new governance test is enforced only when someone remembers to
      # add it here. `tests/test_source_imports.py` was in exactly that state.
      - name: Governance test suite
        run: |
          uv sync --all-packages --locked
          uv run pytest -q

  # ==========================================================================
  # Target selection — computes which path-aware gates must run.
  # Adds targets only; it can never remove a governance gate.
  # ==========================================================================
  select:
    name: select affected targets
    runs-on: ubuntu-24.04
    outputs:
      typescript: ${{ steps.compute.outputs.typescript }}
      python: ${{ steps.compute.outputs.python }}
      any_typescript: ${{ steps.compute.outputs.any_typescript }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Compute changed files and affected targets
        id: compute
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          # An unknown base (first push, force-push, manual dispatch) means the
          # diff cannot be computed — so every target runs. Fail toward running
          # more, never toward running less.
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "unknown base '$base' — running all targets"
            changed="$(git ls-files)"
          else
            changed="$(git diff --name-only "$base" "$head")"
          fi

          echo "--- changed files ---"
          printf '%s\n' "$changed"

          result="$(printf '%s\n' "$changed" | node scripts/affected-targets.mjs --stdin)"
          echo "--- affected ---"
          printf '%s\n' "$result"

          ts="$(printf '%s' "$result" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.stringify(JSON.parse(s).typescript)))")"
          py="$(printf '%s' "$result" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(String(JSON.parse(s).python)))")"

          {
            echo "typescript=$ts"
            echo "python=$py"
            if [ "$ts" = "[]" ]; then echo "any_typescript=false"; else echo "any_typescript=true"; fi
          } >> "$GITHUB_OUTPUT"

  # ==========================================================================
  # Path-aware target gates.
  # A skipped job still reports a conclusion, so a required check never vanishes.
  # ==========================================================================
  typescript:
    name: typescript targets
    needs: select
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Skipped — no TypeScript target affected
        if: needs.select.outputs.any_typescript != 'true'
        run: |
          echo "No TypeScript target affected by this change."
          echo "Repository governance gates ran unconditionally in the 'governance' job."

      - name: Set up Node
        if: needs.select.outputs.any_typescript == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        if: needs.select.outputs.any_typescript == 'true'
        run: corepack enable

      - name: Install (frozen lockfile)
        if: needs.select.outputs.any_typescript == 'true'
        run: pnpm install --frozen-lockfile

      # Filtered to the affected targets by package name, so a dependent runs
      # even when none of its own files changed.
      - name: Lint, typecheck, test, and build affected targets
        if: needs.select.outputs.any_typescript == 'true'
        env:
          TARGETS: ${{ needs.select.outputs.typescript }}
        run: |
          set -euo pipefail
          filters="$(node -e "process.stdout.write(JSON.parse(process.env.TARGETS).map(n => '--filter ' + n).join(' '))")"
          echo "affected targets: $filters"
          # shellcheck disable=SC2086
          pnpm $filters run lint
          # shellcheck disable=SC2086
          pnpm $filters run typecheck
          # shellcheck disable=SC2086
          pnpm $filters run test
          # shellcheck disable=SC2086
          pnpm $filters run build

  python:
    name: python inference target
    needs: select
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Skipped — Python boundary not affected
        if: needs.select.outputs.python != 'true'
        run: |
          echo "No Python target affected by this change."
          echo "Repository governance gates ran unconditionally in the 'governance' job."

      - name: Install uv
        if: needs.select.outputs.python == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync workspace (locked)
        if: needs.select.outputs.python == 'true'
        run: uv sync --all-packages --locked

      # Python-specific quality gates only. The test suite is NOT run here: it
      # is the governance suite (`testpaths = ["tests"]`), and the classifier job
      # above runs all of it unconditionally. Running it again behind a path
      # filter would add nothing — it is strictly weaker than "always" — while
      # requiring this job to install Node and pnpm too, because those tests
      # invoke the real checks as subprocesses.
      - name: Lint, format, and types
        if: needs.select.outputs.python == 'true'
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
