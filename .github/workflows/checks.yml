# Repository merge gate.
#
# The portable part of `scripts/check.sh`, enforced automatically so a future
# change cannot merge without reproducing it. Local evidence from a maintainer's
# Pi is additional evidence, not a substitute for this.
#
# Architecture-neutral: it pins toolchain *versions*, not a CPU architecture, so
# it produces the same verdict here and on the ARM64 Pi. Nothing here deploys,
# starts a service, or touches a credential.
#
# Governed by AGENTS.md and CONTRIBUTING.md.

name: checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scaffold:
    name: scaffold structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Runs first and needs no toolchain — the same property that lets it run
      # on a freshly-prepared Pi before uv or Node exist.
      - name: Validate scaffold
        run: bash scripts/validate-scaffold.sh

  python:
    name: python workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.1"
          enable-cache: true

      # --locked fails if uv.lock is stale rather than silently updating it.
      - name: Sync workspace (locked)
        run: uv sync --all-packages --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy

      - name: Tests
        run: uv run pytest

  typescript:
    name: typescript workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # pnpm comes from the packageManager pin via Corepack — never a global
      # install, so CI and the Pi resolve the same version.
      - name: Enable Corepack
        run: corepack enable

      # --frozen-lockfile fails if pnpm-lock.yaml does not match the manifests.
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Check packages
        run: pnpm -r --if-present run check

  secrets:
    name: no tracked secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The scaffold validator already fails on secret-shaped *filenames*. This
      # additionally looks for secret-shaped *values*, which filename rules
      # cannot catch. Prose about tokens and credentials is expected in this
      # repository, so only assignment-shaped values and known credential
      # formats are treated as findings.
      - name: Scan for secret-shaped values
        run: |
          set -uo pipefail
          status=0

          echo "== assignment-shaped values =="
          if git grep -nEI \
               '(password|secret|token|api[_-]?key|bearer)[[:space:]]*[:=][[:space:]]*["'"'"']?[A-Za-z0-9_./+-]{12,}' \
               -- ':!uv.lock' ':!pnpm-lock.yaml' ':!.github/workflows/checks.yml'; then
            echo "::error::assignment-shaped secret candidate found"
            status=1
          else
            echo "none"
          fi

          echo "== known credential formats =="
          if git grep -nEI \
               '(gh[pousr]_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|eyJ[A-Za-z0-9_-]{20,}\.)' \
               -- ':!uv.lock' ':!pnpm-lock.yaml' ':!.github/workflows/checks.yml'; then
            echo "::error::known credential format found"
            status=1
          fi

          exit $status
