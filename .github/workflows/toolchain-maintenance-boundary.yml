# The three-domain maintenance boundary (AUTH-MAINTENANCE-VERIFIER).
#
# TRUST-CRITICAL. A tool-maintenance candidate is a SUBJECT here, never the
# verifier. Its new tool bytes must actually run for the claim to mean anything,
# and a candidate that ran as the verifier could simply report that it passed.
#
#   TRUSTED CONTROL   exact live predecessor; candidate materialized as inert
#                     data; class-specific content-addressed plan
#          |
#   UNTRUSTED SUBJECT host job; a PREDECESSOR-OWNED launcher runs on the host
#                     and starts the candidate under `docker run`
#          |            +-- OS BOUNDARY created BENEATH the launcher
#          |            +-- candidate: no network, no socket, no creds,
#          |                read-only tree, isolated scratch
#     result DATA
#          |
#   TRUSTED VERDICT   fresh predecessor context; verifies identity, digests and
#                     EXPECTED OUTCOMES, then re-runs classification
#
# WHY THE LAUNCHER IS NOT A JOB CONTAINER. Declaring this job with
# `jobs.<job>.container` runs every `run` step INSIDE that container, so the code
# owning timeouts, exit codes, hashes and the envelope would share a UID and
# filesystem with the candidate it judges -- and a candidate that daemonizes
# outlives its own process there. `--network none` is also ignored as a
# job-level container option. The container must be created by the launcher,
# beneath it, not around it.
#
# `repository_dispatch` is what makes the control domain trustworthy: GitHub
# always runs the DEFAULT BRANCH definition, so a candidate cannot supply the
# workflow that judges it. That is also the bootstrap condition -- until this
# file is on the default branch there is no authoritative run, which is why the
# landing that creates it cannot admit itself.
#
# Every action is pinned to a full commit SHA: a tag is mutable, and these are
# executable dependencies of the root of trust.
#
# Governed by AGENTS.md, ADR-0022, D14, and scripts/toolchain-boundaries.json.
name: toolchain maintenance boundary

on:
  repository_dispatch:
    types: [toolchain-maintenance]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: toolchain-maintenance-${{ github.event.client_payload.pr }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24

jobs:
  trusted-control:
    name: trusted control
    runs-on: ubuntu-24.04
    outputs:
      candidate: ${{ steps.identity.outputs.candidate }}
      predecessor: ${{ steps.identity.outputs.predecessor }}
      plan_digest: ${{ steps.plan.outputs.digest }}
    steps:
      # The payload is DATA. It names which PR to judge; it never names the code
      # that does the judging.
      - name: Validate the dispatch payload as data
        env:
          PR: ${{ github.event.client_payload.pr }}
          CLASS_ID: ${{ github.event.client_payload.class_id }}
        run: |
          set -euo pipefail
          case "$PR" in
            ''|*[!0-9]*) echo "::error::pr must be a positive integer, got '$PR'"; exit 1 ;;
          esac
          case "$CLASS_ID" in
            ''|*[!a-z0-9-]*) echo "::error::class_id is not a class identifier"; exit 1 ;;
          esac

      # The predecessor is the live default-branch tip, and this workflow must
      # BE that commit. If they differ, the definition running here is not the
      # one the repository currently trusts.
      - name: Resolve both identities and pin the predecessor to this execution
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.client_payload.pr }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          default_branch="$(gh api "repos/$REPO" --jq .default_branch)"
          predecessor="$(gh api "repos/$REPO/commits/$default_branch" --jq .sha)"
          state="$(gh api "repos/$REPO/pulls/$PR" --jq .state)"
          base="$(gh api "repos/$REPO/pulls/$PR" --jq .base.ref)"
          candidate="$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)"

          [ "$state" = "open" ] || { echo "::error::PR #$PR is $state"; exit 1; }
          [ "$base" = "$default_branch" ] || { echo "::error::PR #$PR targets $base"; exit 1; }
          if [ "${{ github.sha }}" != "$predecessor" ]; then
            echo "::error::this run is $GITHUB_SHA but the live predecessor is $predecessor"
            exit 1
          fi
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "predecessor=$predecessor" >> "$GITHUB_OUTPUT"

      # PREDECESSOR bytes only. The candidate is never checked out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.identity.outputs.predecessor }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      # The candidate enters as Git objects and is materialized by a
      # predecessor-owned program that admits only regular blobs, proves every
      # destination stays under the root, and writes every file 0644. `tar -x`
      # would restore whatever the candidate's archive described.
      - name: Materialize the candidate as inert data
        env:
          CANDIDATE: ${{ steps.identity.outputs.candidate }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$CANDIDATE"
          node scripts/materialize-candidate.mjs "$CANDIDATE" /tmp/candidate

      # Dependency resolution happens in the TRUSTED domain, with install
      # lifecycle scripts disabled, so fetching the candidate's tools never
      # executes them. `onlyBuiltDependencies` is empty for the same reason.
      - name: Install the candidate's pinned tools without running them
        working-directory: /tmp/candidate
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Build the class-specific content-addressed plan
        id: plan
        env:
          CANDIDATE: ${{ steps.identity.outputs.candidate }}
          PREDECESSOR: ${{ steps.identity.outputs.predecessor }}
          CLASS_ID: ${{ github.event.client_payload.class_id }}
        run: |
          set -euo pipefail
          jq -n --arg p "$PREDECESSOR" --arg c "$CANDIDATE" --arg k "$CLASS_ID" \
            '{predecessorSha:$p, candidateSha:$c, classId:$k, candidateRoot:"/tmp/candidate"}' \
            > /tmp/prepare.json
          node scripts/check-toolchain-boundaries.mjs \
            --boundary prepare-plan /tmp/prepare.json > /tmp/plan-response.json
          jq -r '.plan' /tmp/plan-response.json > /tmp/subject-plan.json
          echo "digest=$(jq -r '.plan.digest' /tmp/plan-response.json)" >> "$GITHUB_OUTPUT"

      - name: Package the candidate payload for the subject domain
        run: tar -C /tmp -cf /tmp/candidate-payload.tar candidate

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: subject-input
          path: |
            /tmp/subject-plan.json
            /tmp/candidate-payload.tar
          retention-days: 5

  untrusted-subject:
    name: untrusted subject
    needs: trusted-control
    runs-on: ubuntu-24.04
    # BOUNDARY 1, at the job level: no token is minted for this job at all.
    permissions: {}
    # NO job-level `container:`. The launcher must stay on the host, outside the
    # boundary it creates for the candidate.
    steps:
      - name: Check out the PREDECESSOR launcher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.trusted-control.outputs.predecessor }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: subject-input
          path: /tmp/input

      - name: Unpack the candidate payload
        run: |
          set -euo pipefail
          mkdir -p /tmp/subject
          tar -C /tmp/subject -xf /tmp/input/candidate-payload.tar

      # The launcher runs HERE, on the host. It starts each candidate command
      # with `docker run` under the policy's controls, owns the timeout and the
      # kill, captures exit status itself, hashes the artifacts it wrote, and
      # builds the envelope. None of that state is reachable from the container.
      - name: Run the candidate as a subject, beneath the launcher
        timeout-minutes: 30
        run: |
          set -euo pipefail
          node scripts/run-subject-launcher.mjs \
            --plan /tmp/input/subject-plan.json \
            --candidate-root /tmp/subject/candidate \
            --out /tmp/subject-result

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: subject-result
          path: /tmp/subject-result
          retention-days: 5

  trusted-verdict:
    name: trusted verdict
    needs: [trusted-control, untrusted-subject]
    # `always()` so a subject that fails, hangs, or is cancelled still reaches a
    # trusted verdict. A missing verdict must never read as a pass.
    if: always()
    runs-on: ubuntu-24.04
    steps:
      # A FRESH predecessor context. Nothing from the subject job carries here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.trusted-control.outputs.predecessor }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Require the subject to have produced a result
        if: needs.untrusted-subject.result != 'success'
        run: |
          echo "::error::the subject job did not complete (${{ needs.untrusted-subject.result }})"
          exit 1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: subject-input
          path: /tmp/input
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: subject-result
          path: /tmp/result

      # Identities, plan digest, command identities, cwd, binary identity, input
      # digests, artifact digests, AND the predecessor's expected outcome for
      # every command. Without that last one a candidate could fail everything
      # and still be admitted, because classification proves admissible data
      # difference rather than that the new tool works.
      - name: Verify the envelope against the plan
        run: |
          set -euo pipefail
          node -e "
            const fs = require('node:fs'), crypto = require('node:crypto')
            const plan = JSON.parse(fs.readFileSync('/tmp/input/subject-plan.json', 'utf8'))
            const digests = {}
            for (const name of plan.expectedArtifacts) {
              const p = '/tmp/result/' + name
              digests[name] = fs.existsSync(p)
                ? crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex')
                : null
            }
            fs.writeFileSync('/tmp/verify.json', JSON.stringify({
              plan,
              envelope: JSON.parse(fs.readFileSync('/tmp/result/envelope.json', 'utf8')),
              artifactDigests: digests,
            }))
          "
          node scripts/check-toolchain-boundaries.mjs --boundary verify-envelope /tmp/verify.json

      # The verdict is the PREDECESSOR's classification, re-run here. The
      # subject observed; it did not decide.
      - name: Re-run predecessor-owned maintenance classification
        env:
          CANDIDATE: ${{ needs.trusted-control.outputs.candidate }}
          PREDECESSOR: ${{ needs.trusted-control.outputs.predecessor }}
          CLASS_ID: ${{ github.event.client_payload.class_id }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$CANDIDATE"
          node scripts/build-maintenance-plan.mjs \
            --predecessor "$PREDECESSOR" --candidate "$CANDIDATE" --class "$CLASS_ID" \
            > /tmp/classification-plan.json
          node scripts/check-toolchain-boundaries.mjs --plan /tmp/classification-plan.json

      # The candidate's own native platform proof must exist for THIS candidate.
      # A tool that runs on one architecture has not been shown to run on both.
      - name: Require the candidate's native platform proof
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CANDIDATE: ${{ needs.trusted-control.outputs.candidate }}
        run: |
          set -euo pipefail
          conclusion="$(gh api "repos/$REPO/actions/runs?head_sha=$CANDIDATE" \
            --jq '[.workflow_runs[] | select(.name=="toolchain platform")] | first | .conclusion')"
          [ "$conclusion" = "success" ] || {
            echo "::error::no successful native platform proof for $CANDIDATE (got $conclusion)"
            exit 1
          }

      # Point-in-time evidence. Either identity moving independently means what
      # was proved is not what would merge.
      - name: Re-resolve both identities and refuse movement
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.client_payload.pr }}
        run: |
          set -euo pipefail
          default_branch="$(gh api "repos/$REPO" --jq .default_branch)"
          jq -n \
            --arg sc "${{ needs.trusted-control.outputs.candidate }}" \
            --arg sp "${{ needs.trusted-control.outputs.predecessor }}" \
            --arg ec "$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)" \
            --arg ep "$(gh api "repos/$REPO/commits/$default_branch" --jq .sha)" \
            '{start:{candidateSha:$sc,predecessorSha:$sp}, end:{candidateSha:$ec,predecessorSha:$ep}}' \
            > /tmp/freshness.json
          node scripts/check-toolchain-boundaries.mjs --boundary check-freshness /tmp/freshness.json

      # One canonical record. A later maintenance claim cites this, so the facts
      # it rests on are written down rather than left in log prose.
      - name: Emit point-in-time maintenance evidence
        run: |
          set -euo pipefail
          jq -n \
            --arg candidate "${{ needs.trusted-control.outputs.candidate }}" \
            --arg predecessor "${{ needs.trusted-control.outputs.predecessor }}" \
            --arg execution "${{ github.sha }}" \
            --arg run_id "${{ github.run_id }}" \
            --arg workflow "${{ github.workflow_ref }}" \
            --arg class_id "${{ github.event.client_payload.class_id }}" \
            --arg plan_digest "${{ needs.trusted-control.outputs.plan_digest }}" \
            --slurpfile envelope /tmp/result/envelope.json \
            '{
               schemaVersion: 1,
               result: "MAINTENANCE_ADMITTED",
               candidateSha: $candidate,
               predecessorSha: $predecessor,
               executionSha: $execution,
               runId: $run_id,
               verifierWorkflow: $workflow,
               classId: $class_id,
               planDigest: $plan_digest,
               commands: ($envelope[0].results | map({id, binary, cwd, exitCode, inputs})),
               artifacts: $envelope[0].artifacts,
               evidenceKind: "POINT_IN_TIME"
             }' > maintenance-evidence.json
          cat maintenance-evidence.json
          echo "MAN-TS7-01 remains an owner control: re-confirm head, base, merge tree and"
          echo "protected authorities at merge. This run does not admit a merge."

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maintenance-evidence
          path: maintenance-evidence.json
          retention-days: 90
