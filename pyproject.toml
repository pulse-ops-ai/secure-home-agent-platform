# Root of the Python (uv) workspace.
#
# TypeScript is the primary implementation language (ADR-0012, accepted). This
# workspace is retained ONLY for the admitted Python boundary: isolated
# specialist inference workers under services/workers/, where a mature ML,
# vision, or audio dependency requires Python and no adequate TypeScript
# equivalent exists.
#
# The member list is EXPLICIT rather than globbed. A glob would let a Python
# package rejoin the control plane by accident; admitting one must be a decision.
#
# A Python worker may never own authorization, deterministic safety policy, Home
# Assistant credentials, device actuation, authoritative persistence, or envelope
# minting or verification (ADR-0012 §6).
#
# This is a VIRTUAL workspace root: it has no [project] table, so the root itself
# is not a distributable package.
#
# Governed by AGENTS.md and docs/decisions/INDEX.md.

[tool.uv.workspace]
members = [
    "services/workers/python-inference",
]

[dependency-groups]
# Shared development tooling. There are deliberately NO runtime dependencies
# anywhere in this workspace: no web framework, no agent framework, no Home
# Assistant client. Adding one is a reviewed decision (see AGENTS.md).
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.9",
]

# ---------------------------------------------------------------------------
# Ruff — lint and format
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py313"
line-length = 100
src = [
    "services/workers/python-inference/src",
    "tests",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "PTH",  # flake8-use-pathlib
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "S",    # flake8-bandit — this platform controls physical devices
]

[tool.ruff.lint.per-file-ignores]
# S101: assertions are the point of a test.
# S603/S607: the secret-scanner tests deliberately invoke the real script via
# subprocess against a throwaway repo — testing the shipped behaviour rather
# than a reimplementation of it is the whole point.
"tests/**" = ["S101", "S603", "S607"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy — types
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
# Explicit target list rather than a bare "." so mypy never wanders into
# .venv/ or a generated directory. Update this when a member is added.
files = [
    "services/workers/python-inference/src",
    "tests",
]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
