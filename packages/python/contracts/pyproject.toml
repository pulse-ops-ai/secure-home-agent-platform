[project]
name = "secure-home-contracts"
version = "0.0.0"
description = "Typed models for the platform's core objects, derived from schemas/."
readme = "README.md"
requires-python = ">=3.13"
# No runtime dependencies. See AGENTS.md — adding one is a reviewed decision.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secure_home_contracts"]
