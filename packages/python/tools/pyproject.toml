[project]
name = "secure-home-tools"
version = "0.0.0"
description = "Governed tool surface: capability-scoped clients that re-enter through enforcement points."
readme = "README.md"
requires-python = ">=3.13"
# No runtime dependencies. See AGENTS.md — adding one is a reviewed decision.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secure_home_tools"]
