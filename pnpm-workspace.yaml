# Root of the TypeScript (pnpm) workspace.
#
# The pnpm version is pinned by "packageManager" in package.json and provisioned
# by Corepack. Do not install pnpm globally.
#
# Governed by ADR-0012 (accepted) and AGENTS.md.

# ---------------------------------------------------------------------------
# Workspace membership — canonical taxonomy (ADR-0012 §5)
#
# Globs are one level deep on purpose. A recursive `**` glob would sweep in
# generated output (dist/, node_modules/), test fixtures, and nested example
# directories, so a package would join the workspace by accident rather than by
# decision.
# ---------------------------------------------------------------------------
packages:
  # Deployable backend processes.
  - 'services/*'
  # Specialist workers. Python inference workers live here too, but they are uv
  # members, not pnpm members — this glob only picks up TypeScript workers.
  - 'services/workers/*'
  # Human-facing applications.
  - 'apps/*'
  # Reusable libraries with no runtime identity.
  - 'packages/*'
  # Agent implementations, only where an agent is itself a pnpm package.
  - 'agents/*'

# ---------------------------------------------------------------------------
# Catalog — the canonical declaration point for shared external versions
# (ADR-0012 §19).
#
# EVERY external dependency goes through the catalog, with no exceptions: one
# rule is easier to enforce and to remember than "shared ones do". A package
# references `catalog:`; the version lives here and nowhere else, so "which
# version of X does this repository use?" has exactly one answer.
#
# Syncpack enforces that packages reference the catalog rather than restating a
# version. The lockfile records what actually resolved.
#
# Only what the workspace foundation and its validation genuinely need is here.
# NestJS, Fastify, Next.js, Zod, and Winston are named by ADR-0012 but belong to
# the issues that implement them (#26, #27, #28, and the web-shell issue).
# ---------------------------------------------------------------------------
catalog:
  # Node type definitions. Required: shared tooling and its tests use Node
  # builtins (node:fs, node:path, node:child_process).
  '@types/node': 24.10.1
  # Type checking and build.
  #
  # PINNED TO 6.x DELIBERATELY. typescript-eslint 8.66 supports
  # '>=4.8.4 <6.1.0' and throws outright on TS 7 ("does not support TS 7.0"),
  # which makes type-aware linting fail or, worse, pass or fail depending on
  # which TypeScript copy resolves first. Raising this past 6.0.x requires a
  # typescript-eslint release that supports it — tests/ asserts the pairing.
  typescript: 6.0.3
  # Linting.
  eslint: 10.8.0
  '@eslint/js': 10.0.1
  typescript-eslint: 8.66.0
  # Lint globals (Node/browser sets) — tiny, data-only.
  globals: 17.9.0
  # Manifest governance.
  syncpack: 15.3.2
  # Formatting. Prettier is the SINGLE formatting authority (#25); ESLint 10
  # ships no formatting rules in core and this workspace adds no stylistic
  # plugin, so the two cannot conflict.
  prettier: 3.9.6
  # Runner domain contracts: the single authored contract source (ADR-0012
  # §7), added by L2/#51 (runner-domain-contracts).
  zod: 4.4.3
  # Test runner and coverage. V8 coverage is built into Node — no native
  # compilation, so it works on the ARM64 Pi and on x86_64 CI alike.
  vitest: 4.1.10
  '@vitest/coverage-v8': 4.1.10

# No dependency in this workspace is permitted to run an install script.
# When one legitimately needs to, it is added here by an explicit reviewed
# change — never by an automatic approval prompt.
onlyBuiltDependencies: []
