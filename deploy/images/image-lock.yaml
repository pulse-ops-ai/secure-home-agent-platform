# Validated by scripts/check-images.mjs against a strict closed grammar
# (two-space indents, block collections only, fixed key order, full-line
# comments only) with exactly one logical reading. The checker is the one
# parser; a representation it refuses has no meaning here.
#
# Digest vocabulary, exactly:
#   digest                    the OCI image-index digest covering every
#                             declared platform — the canonical locked
#                             identity, and what a future profile pins
#   manifests[].digest        the per-platform image-manifest digest — the
#                             artifact a runtime on that platform actually
#                             consumes, and what run evidence records
#   external_base.digest      the upstream base's own index digest, matching
#                             the inline pin in the Dockerfile
#
# `pending-first-governed-build` is the explicit bootstrap sentinel: valid
# syntax, never a completed identity. The governed build path
# (.github/workflows/images.yml) fails while it is present, reporting the
# freshly built digests as the evidence to record; digests enter this file
# from that evidence only.
